name: Build Miya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'security/**'
      - 'assets/**'
      - '*.vrm'

permissions:
  contents: write

# ek saath do build chalne se tag/release clash na ho
concurrency:
  group: miya-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pehle jaisi galti (scripts/miya-setup.txt me Java paste ho jana) ab turant saaf message ke saath pakdi jaati hai
      - name: Check source files
        run: |
          fail() { echo "❌ $1"; exit 1; }
          head -n 1 scripts/miya-setup.txt | grep -q '^#!/bin/bash' \
            || fail "scripts/miya-setup.txt bash script nahi hai (pehli line #!/bin/bash honi chahiye)"
          head -n 1 scripts/miya-voice.txt | grep -q '^package com.miya.app;' \
            || fail "scripts/miya-voice.txt MiyaService.java hona chahiye (pehli line: package com.miya.app;)"
          grep -q 'static final String APP_KEY' scripts/miya-voice.txt \
            || fail "scripts/miya-voice.txt me 'static final String APP_KEY' wali line nahi hai"
          [ -f security/SecurityModule.java ] \
            || fail "security/SecurityModule.java nahi mili (MainActivity ko ye chahiye)"
          [ -f assets/index.html ] \
            || fail "assets/index.html nahi mili"
          echo "✅ Source files theek hain"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # apt-get update hata diya (unzip/wget runner pe already hain, update kabhi-kabhi fail hota hai)
      - name: Install Android SDK
        run: |
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip && mv cmdline-tools latest
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Create project structure
        run: bash scripts/miya-setup.txt

      - name: Install Voice Service
        run: |
          cp scripts/miya-voice.txt miya-app/app/src/main/java/com/miya/app/MiyaService.java
          echo "✅ Voice service installed"

      - name: Install Web UI + VRM
        run: |
          mkdir -p miya-app/app/src/main/assets
          cp assets/index.html miya-app/app/src/main/assets/index.html
          echo "✅ Web UI installed"
          shopt -s nullglob
          for f in *.vrm; do
            cp -f "$f" miya-app/app/src/main/assets/
            echo "✅ Model: $f"
          done

      - name: Inject Security Module
        run: |
          cp security/SecurityModule.java miya-app/app/src/main/java/com/miya/app/SecurityModule.java
          echo "✅ SecurityModule injected"

      # MainActivity ko BuildConfig fields (INTEGRITY_BASE_URL, CLOUD_PROJECT_NUMBER) aur
      # biometric / play-integrity dependencies chahiye, isliye ye patch hamesha chalta hai.
      - name: Patch Gradle
        run: |
          python3 - <<'PY'
          import os, re, sys
          g = 'miya-app/app/build.gradle'
          k = 'miya-app/app/build.gradle.kts'
          if os.path.exists(g):
              path, kts = g, False
          elif os.path.exists(k):
              path, kts = k, True
          else:
              print('❌ app build.gradle not found'); sys.exit(1)
          s = open(path, encoding='utf-8').read()

          def insert_after(pattern, line, s, label):
              m = re.search(pattern, s, re.M)
              if not m:
                  print('❌ ' + label + ' block not found in ' + path); sys.exit(1)
              return s[:m.end()] + '\n        ' + line + s[m.end():]

          if not re.search(r'buildConfig\s*=?\s*true', s):
              line = 'buildFeatures { buildConfig = true }' if kts else 'buildFeatures { buildConfig true }'
              s = insert_after(r'^android\s*\{', line, s, 'android')
          fields = [('EXPECTED_SIG_SHA256', 'String', '"\\"\\""'),
                    ('INTEGRITY_BASE_URL', 'String', '"\\"\\""'),
                    ('CLOUD_PROJECT_NUMBER', 'long', '"0L"')]
          for name, typ, val in fields:
              if name not in s:
                  fmt = 'buildConfigField("%s", "%s", %s)' if kts else 'buildConfigField "%s", "%s", %s'
                  s = insert_after(r'defaultConfig\s*\{', fmt % (typ, name, val), s, 'defaultConfig')
          deps = [('security-crypto', 'androidx.security:security-crypto:1.1.0-alpha06'),
                  ('play:integrity', 'com.google.android.play:integrity:1.4.0'),
                  ('androidx.biometric', 'androidx.biometric:biometric:1.1.0'),
                  ('androidx.webkit', 'androidx.webkit:webkit:1.11.0')]
          for key, coord in deps:
              if key not in s:
                  line = ('implementation("%s")' if kts else 'implementation "%s"') % coord
                  s = insert_after(r'^dependencies\s*\{', line, s, 'dependencies')
          open(path, 'w', encoding='utf-8').write(s)
          print('✅ Gradle patched: ' + path)
          PY

      # sed token mein | & \ " aaye to toot jata tha. Ab python se safe replace.
      - name: Insert API Token
        env:
          MIYA_TOKEN: ${{ secrets.MIYA_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          f = 'miya-app/app/src/main/java/com/miya/app/MiyaService.java'
          tok = os.environ.get('MIYA_TOKEN', '')
          if not tok:
              print('⚠️ MIYA_TOKEN secret khali hai — AI wale features (agent) 401 denge'); sys.exit(0)
          s = open(f, encoding='utf-8').read()
          esc = tok.replace('\\', '\\\\').replace('"', '\\"')
          new, n = re.subn(r'static final String APP_KEY\s*=\s*.*?;',
                           lambda m: 'static final String APP_KEY = "' + esc + '";', s, count=1)
          if n == 0:
              print('❌ APP_KEY line nahi mili'); sys.exit(1)
          open(f, 'w', encoding='utf-8').write(new)
          print('✅ Token injected')
          PY

      # Manifest me FGS type + permissions + <queries> khud lagao. Pehle se hon to dobara nahi lagta.
      - name: Patch Manifest
        run: |
          python3 - <<'PY'
          import re, sys
          p = 'miya-app/app/src/main/AndroidManifest.xml'
          try:
              s = open(p, encoding='utf-8').read()
          except FileNotFoundError:
              print('❌ AndroidManifest.xml nahi bana (scripts/miya-setup.txt check karo)'); sys.exit(1)

          perms = ['android.permission.FOREGROUND_SERVICE',
                   'android.permission.FOREGROUND_SERVICE_MICROPHONE',
                   'android.permission.RECORD_AUDIO',
                   'android.permission.CAMERA',
                   'android.permission.ACCESS_FINE_LOCATION',
                   'android.permission.POST_NOTIFICATIONS']
          add = ''.join('    <uses-permission android:name="%s"/>\n' % x
                        for x in perms if '"%s"' % x not in s)
          m = re.search(r'<application\b', s)
          if not m:
              print('❌ <application> tag nahi mila'); sys.exit(1)

          pkgs = ['com.whatsapp', 'com.topjohnwu.magisk', 'eu.chainfire.supersu',
                  'com.koushikdutta.superuser', 'com.noshufou.android.su']
          q = ''.join('        <package android:name="%s"/>\n' % x
                      for x in pkgs if '"%s"' % x not in s)
          if 'android.speech.RecognitionService' not in s:
              q += ('        <intent>\n'
                    '            <action android:name="android.speech.RecognitionService"/>\n'
                    '        </intent>\n')
          if q and '<queries>' not in s:
              add += '    <queries>\n' + q + '    </queries>\n'
              q = ''
          if add:
              s = s[:m.start()] + add.lstrip() + '    ' + s[m.start():]
          if q:
              s = s.replace('<queries>', '<queries>\n' + q.rstrip('\n'), 1)

          found = False
          def fix(mt):
              global found
              tag = mt.group(0)
              if 'MiyaService' not in tag:
                  return tag
              found = True
              if 'foregroundServiceType' in tag:
                  return tag
              return tag.replace('<service', '<service android:foregroundServiceType="microphone"', 1)
          s = re.sub(r'<service\b[^>]*>', fix, s)
          if not found:
              print('❌ MiyaService ka <service> tag manifest mein nahi mila'); print(s); sys.exit(1)

          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Validate Manifest
        run: |
          M=miya-app/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="microphone"' "$M" || { echo "❌ FGS type missing"; exit 1; }
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' "$M" || { echo "❌ FGS mic permission missing"; exit 1; }
          grep -q 'RECORD_AUDIO' "$M" || { echo "❌ RECORD_AUDIO missing"; exit 1; }
          grep -q 'MiyaAccessibilityService' "$M" || { echo "❌ Accessibility service missing"; exit 1; }
          echo "✅ Manifest OK"

      - name: Build Debug APK
        run: |
          cd miya-app
          gradle assembleDebug --no-daemon --stacktrace

      # Build fail ho to bhi reports upload hon, taaki error dekh sako
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miya-build-${{ github.run_number }}
          path: |
            miya-app/app/build/outputs/apk/debug/*.apk
            miya-app/app/build/reports/
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          APK=$(ls miya-app/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "Miya-${{ github.run_number }}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miya-${{ github.run_number }}
          name: Miya Build #${{ github.run_number }}
          files: Miya-${{ github.run_number }}.apk
          generate_release_notes: true
