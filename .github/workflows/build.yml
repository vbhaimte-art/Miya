name: Build Miya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'miya-setup.txt'
      - 'model.vrm'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Create project
        run: bash miya-setup.txt

      - name: Patch app
        run: |
          python3 - <<'PYEOF'
          p = 'miya-app/app/src/main/java/com/miya/app/MiyaService.java'
          s = open(p, encoding='utf-8').read()
          def rep(a, b):
              global s
              assert s.count(a) == 1, a
              s = s.replace(a, b)
          rep("""        if (rec == null) {""", """        if (rec != null) { rec.destroy(); rec = null; }
                  if (rec == null) {""")
          rep("""public void onReadyForSpeech(Bundle p) { }""", """public void onReadyForSpeech(Bundle p) { js("setStatus('अब बोलिए…')"); }""")
          rep("""public void onPartialResults(Bundle b) { }""", """public void onPartialResults(Bundle b) {
                              ArrayList<String> pr = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (pr != null && !pr.isEmpty()) js("setStatus(" + JSONObject.quote("सुना: " + pr.get(0)) + ")");
                          }""")
          rep("""i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");""", """i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2500);
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 2000);""")
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF

      - name: Keep same signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miya-debug-keystore

      - name: Build APK
        run: gradle -p miya-app assembleDebug --no-daemon --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miya-${{ github.run_number }}
          name: Miya ${{ github.run_number }}
          files: miya-app/app/build/outputs/apk/debug/app-debug.apk
