name: Build Miya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'miya-setup.txt'
      - 'miya-voice.txt'
      - 'model.vrm'
      - 'thron.vrm'
      - 'yor.vrm'
      
      
      
    

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Create project
        run: bash miya-setup.txt

      - name: Install voice service
        run: cp miya-voice.txt miya-app/app/src/main/java/com/miya/app/MiyaService.java

      - name: Insert token
        env:
          MIYA_TOKEN: ${{ secrets.MIYA_TOKEN }}
        run: |
          sed -i "s|static final String APP_KEY = .*|static final String APP_KEY = \"$MIYA_TOKEN\";|" miya-app/app/src/main/java/com/miya/app/MiyaService.java

      - name: Patch manifest
        run: |
          python3 - <<'PYEOF'
          p = 'miya-app/app/src/main/AndroidManifest.xml'
          t = open(p, encoding='utf-8').read()
          t = t.replace('<service android:name=".MiyaService" android:exported="false"/>', '<service android:name=".MiyaService" android:exported="false" android:foregroundServiceType="microphone"/>')
          t = t.replace('<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>')
          open(p, 'w', encoding='utf-8').write(t)
          PYEOF

      - name: Keep same signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miya-debug-keystore

      - name: Build APK
        run: gradle -p miya-app assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp miya-app/app/build/outputs/apk/debug/app-debug.apk Miya-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miya-${{ github.run_number }}
          name: Miya ${{ github.run_number }}
          files: Miya-${{ github.run_number }}.apk
