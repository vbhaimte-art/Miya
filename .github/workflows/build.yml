name: Build Miya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/miya-setup.txt'
      - 'scripts/miya-voice.txt'
      - 'security/SecurityModule.java'
      - 'assets/index.html'
      - '*.vrm'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          sudo apt-get update && sudo apt-get install -y unzip wget
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip && mv cmdline-tools latest
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Make setup executable
        run: chmod +x scripts/miya-setup.txt

      - name: Create project structure
        run: bash scripts/miya-setup.txt

      - name: Install Voice Service
        run: |
          mkdir -p miya-app/app/src/main/java/com/miya/app
          cp scripts/miya-voice.txt miya-app/app/src/main/java/com/miya/app/MiyaService.java

      - name: Inject Security Module
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ -f security/SecurityModule.java ]; then
            cp security/SecurityModule.java miya-app/app/src/main/java/com/miya/app/SecurityModule.java
            echo "✅ SecurityModule injected"
          else
            echo "⚠️ SecurityModule.java not found, skipping..."
          fi

      - name: Insert API Token
        env:
          MIYA_TOKEN: ${{ secrets.MIYA_TOKEN }}
        run: |
          FILE="miya-app/app/src/main/java/com/miya/app/MiyaService.java"
          if grep -q "APP_KEY" "$FILE"; then
            python3 -c "
            import re
            with open('$FILE', 'r') as f: content = f.read()
            new_content = re.sub(r'static final String APP_KEY = .*?;', 
                                 'static final String APP_KEY = \"${{ secrets.MIYA_TOKEN }}\";', content)
            with open('$FILE', 'w') as f: f.write(new_content)
            "
            echo "✅ Token injected safely"
          else
            echo "⚠️ APP_KEY placeholder not found"
          fi

      - name: Patch Manifest
        run: |
          python3 - <<'PYEOF'
          p = 'miya-app/app/src/main/AndroidManifest.xml'
          try:
              t = open(p, encoding='utf-8').read()
              if 'foregroundServiceType="microphone"' not in t:
                  t = t.replace('<service android:name=".MiyaService"', 
                                '<service android:name=".MiyaService" android:foregroundServiceType="microphone"')
              if 'FOREGROUND_SERVICE_MICROPHONE' not in t:
                  t = t.replace('android.permission.FOREGROUND_SERVICE"/>', 
                                'android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>')
              open(p, 'w', encoding='utf-8').write(t)
              print("✅ Manifest patched")
          except Exception as e:
            print(f"❌ Patch failed: {e}")
          PYEOF

            - name: Build Debug APK
        run: |
          cd miya-app
          
          # Create wrapper directory
          mkdir -p gradle/wrapper
          
          # Write properties using echo (Safe for mobile editors)
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

          # Download gradle-wrapper.jar directly from official source
          wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          
          # Create gradlew script using printf (No indentation issues)
          printf '#!/bin/sh\nexec java -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"\n' > gradlew
          chmod +x gradlew
          
          # Build APK
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp miya-app/app/build/outputs/apk/debug/app-debug.apk Miya-${{ github.run_number }}.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miya-${{ github.run_number }}
          name: Miya Build #${{ github.run_number }}
          files: Miya-${{ github.run_number }}.apk
          generate_release_notes: true
