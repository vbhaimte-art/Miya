name: Build Miya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'miya-setup.txt'
      - 'model.vrm'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Create project
        run: bash miya-setup.txt

      - name: Patch app
        run: |
          python3 - <<'PYEOF'
          p = 'miya-app/app/src/main/java/com/miya/app/MiyaService.java'
          s = open(p, encoding='utf-8').read()
          def rep(a, b):
              global s
              assert s.count(a) == 1, a
              s = s.replace(a, b)
          rep("""        if (rec == null) {""", """        if (rec != null) { rec.destroy(); rec = null; }
                  if (rec == null) {""")
          rep("""public void onReadyForSpeech(Bundle p) { }""", """public void onReadyForSpeech(Bundle p) { js("setStatus('अब बोलिए…')"); }""")
          rep("""public void onPartialResults(Bundle b) { }""", """public void onPartialResults(Bundle b) {
                              ArrayList<String> pr = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (pr != null && !pr.isEmpty()) {
                                  lastPartial = pr.get(0);
                                  js("setStatus(" + JSONObject.quote("सुना: " + lastPartial) + ")");
                                  ui.removeCallbacks(fallback);
                                  ui.postDelayed(fallback, 3500);
                              }
                          }""")
          rep("""boolean ttsReady = false, speaking = false, busy = false;""", """boolean ttsReady = false, speaking = false, busy = false;
              String lastPartial = "";
              final Runnable fallback = () -> {
                  String t = lastPartial;
                  lastPartial = "";
                  if (!t.isEmpty() && !busy) {
                      if (rec != null) rec.cancel();
                      ask(t);
                  }
              };""")
          rep("""if (r != null && !r.isEmpty()) ask(r.get(0));""", """ui.removeCallbacks(fallback);
                              lastPartial = "";
                              if (r != null && !r.isEmpty() && !busy) ask(r.get(0));""")
          rep("""public void onError(int code) {""", """public void onError(int code) {
                              if (!lastPartial.isEmpty()) {
                                  ui.removeCallbacks(fallback);
                                  String t = lastPartial;
                                  lastPartial = "";
                                  if (!busy) ask(t);
                                  return;
                              }""")
          rep("""rec.startListening(i);""", """lastPartial = "";
                  rec.startListening(i);""")
          rep("""i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");""", """i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2500);
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 2000);""")
          rep("""import android.content.Intent;""", """import android.content.Intent;
          import android.content.pm.ServiceInfo;""")
          rep("""import android.os.Bundle;""", """import android.os.Build;
          import android.os.Bundle;""")
          rep("""startForeground(1, n);""", """if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                      } catch (Exception e) {
                          startForeground(1, n);
                      }
                  } else {
                      startForeground(1, n);
                  }""")
          open(p, 'w', encoding='utf-8').write(s)
          m = 'miya-app/app/src/main/AndroidManifest.xml'
          t = open(m, encoding='utf-8').read()
          a = """<service android:name=".MiyaService" android:exported="false"/>"""
          assert t.count(a) == 1
          t = t.replace(a, """<service android:name=".MiyaService" android:exported="false" android:foregroundServiceType="microphone"/>""")
          b = """<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>"""
          assert t.count(b) == 1
          t = t.replace(b, b + """
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>""")
          open(m, 'w', encoding='utf-8').write(t)
          PYEOF

      - name: Keep same signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miya-debug-keystore

      - name: Build APK
        run: gradle -p miya-app assembleDebug --no-daemon --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miya-${{ github.run_number }}
          name: Miya ${{ github.run_number }}
          files: miya-app/app/build/outputs/apk/debug/app-debug.apk
