<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>मिया</title>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
}}
</script>
<style>
:root{--bg:#f3efe6;--ink:#232a3b;--face:#8fcfbf;--soft:#dfe7e1;--accent:#e0b23a;--me:#232a3b;--me-t:#fff;--bot:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171c2a;--ink:#eef0f5;--face:#7cc3b2;--soft:#262d40;--accent:#e0b23a;--me:#e0b23a;--me-t:#171c2a;--bot:#262d40}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{position:relative;height:36vh;min-height:230px;max-height:360px;flex:none}
#cv{width:100%;height:100%;display:block}
#face{position:absolute;left:50%;top:50%;width:140px;height:140px;transform:translate(-50%,-50%)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.talk #mouth{animation:talk .28s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
#status{text-align:center;font-size:13px;opacity:.7;height:20px;flex:none}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:16px;line-height:1.5;font-size:16px;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--me);color:var(--me-t);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--soft);flex:none}
#txt{flex:1;border:0;border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);min-width:0}
button{border:0;border-radius:50%;width:46px;height:46px;font-size:20px;background:var(--ink);color:var(--bg);cursor:pointer}
#mic.on{background:var(--accent);color:#232a3b}
button:focus-visible,#txt:focus-visible{outline:3px solid var(--accent)}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>
<svg id="face" viewBox="0 0 150 150" aria-label="चेहरा">
<circle cx="75" cy="75" r="68" fill="var(--face)"/>
<ellipse class="eye" cx="52" cy="62" rx="8" ry="10" fill="#232a3b"/>
<ellipse class="eye" cx="98" cy="62" rx="8" ry="10" fill="#232a3b"/>
<ellipse id="mouth" cx="75" cy="102" rx="16" ry="9" fill="#232a3b"/>
</svg>
</div>
<div id="status"></div>
<div id="log"></div>
<div id="bar">
<button id="mic" title="बोलें" aria-label="बोलें">🎤</button>
<input id="txt" placeholder="यहाँ लिखें…" autocomplete="off">
<button id="send" title="भेजें" aria-label="भेजें">➤</button>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

// ====== यहाँ अपनी सेटिंग बदलें ======
const WORKER_URL = "https://young-sky-01cdmy-assistant-api.vbhaimte.workers.dev";
const NAME = "मिया";
const MODEL = "model.vrm";
const PERSONA = `तुम "${NAME}" हो, मेरी निजी असिस्टेंट और दोस्त। मुझसे हिंदी में बात करो (मैं अंग्रेज़ी में लिखूँ तो अंग्रेज़ी में)।
जवाब छोटे रखो, 1-3 वाक्य, क्योंकि तुम बोलकर जवाब देती हो। इमोजी और markdown का इस्तेमाल मत करो।
अपनी सीधी और ईमानदार राय दो। मेरी हर बात से सहमत मत होना; ग़लत लगे तो सलीक़े से टोको और कारण बताओ।
ज़रूरत हो तो एक सवाल पूछो, उससे ज़्यादा नहीं।`;
// ====================================

const $ = id => document.getElementById(id);
const log = $("log"), txt = $("txt"), status = $("status"), mic = $("mic");
let speaking = false;
let history = [];
try { history = JSON.parse(localStorage.getItem("hist") || "[]"); } catch (e) {}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "me" : "bot");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
history.forEach(h => add(h.role, h.parts[0].text));
if (!history.length) add("model", "नमस्ते! मैं " + NAME + " हूँ। माइक दबाकर बोलिए या लिखिए।");
function save() {
  history = history.slice(-20);
  try { localStorage.setItem("hist", JSON.stringify(history)); } catch (e) {}
}

// ---- 3D अवतार ----
let vrm = null, head = null;
const canvas = $("cv");
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 20);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 2, 2);
scene.add(sun);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
loader.load(MODEL, gltf => {
  vrm = gltf.userData.vrm;
  try { VRMUtils.removeUnnecessaryVertices(gltf.scene); } catch (e) {}
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  const h = vrm.humanoid;
  head = h.getNormalizedBoneNode("head");
  const la = h.getNormalizedBoneNode("leftUpperArm"), ra = h.getNormalizedBoneNode("rightUpperArm");
  if (la) la.rotation.z = -1.2;
  if (ra) ra.rotation.z = 1.2;
  vrm.scene.updateMatrixWorld(true);
  const p = new THREE.Vector3();
  head.getWorldPosition(p);
  const box = new THREE.Box3().setFromObject(vrm.scene);
const sz = box.getSize(new THREE.Vector3());
const ctr = box.getCenter(new THREE.Vector3());
const dist = (sz.y / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.35;
camera.position.set(0, ctr.y, dist);
camera.lookAt(0, ctr.y, 0);

  $("face").style.display = "none";
}, undefined, () => { status.textContent = "3D मॉडल नहीं मिला, साधारण चेहरा दिख रहा है।"; });
// ---- size badalna ----
let sizeTimer = null;
function resizeMiya(target) {
  if (!vrm) return;
  clearInterval(sizeTimer);
  sizeTimer = setInterval(() => {
    let s = vrm.scene.scale.x;
    s += (target - s) * 0.1;
    if (Math.abs(target - s) < 0.01) { s = target; clearInterval(sizeTimer); }
    vrm.scene.scale.setScalar(s);
    vrm.scene.updateMatrixWorld(true);
    const hp = new THREE.Vector3();
    head.getWorldPosition(hp);
    camera.position.set(0, hp.y - 0.02, 0.95);
    camera.lookAt(0, hp.y - 0.08, 0);
  }, 16);
}

function checkSize(text) {
  if (/chhoti ho ja|choti ho ja|छोटी हो जा/i.test(text)) resizeMiya(0.5);
  else if (/badi ho ja|bdi ho ja|बड़ी हो जा/i.test(text)) resizeMiya(1.4);
  else if (/normal ho ja|नॉर्मल हो जा|सामान्य हो जा/i.test(text)) resizeMiya(1);
}
const waitVrm = setInterval(() => {
  if (vrm && head) { clearInterval(waitVrm); setTimeout(() => resizeMiya(0.5), 1500); }
}, 300);
let nextBlink = 2, blinkT = -1;
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (vrm) {
    const em = vrm.expressionManager;
    const target = speaking ? 0.25 + 0.45 * Math.abs(Math.sin(t * 13)) + 0.15 * Math.random() : 0;
    const cur = em.getValue("aa") || 0;
    em.setValue("aa", cur + (target - cur) * 0.35);
    if (blinkT < 0 && t > nextBlink) blinkT = 0;
    if (blinkT >= 0) {
      blinkT += dt;
      em.setValue("blink", Math.max(0, Math.sin(Math.min(blinkT / 0.18, 1) * Math.PI)));
      if (blinkT > 0.18) { blinkT = -1; nextBlink = t + 2 + Math.random() * 3; }
    }
    if (head) { head.rotation.y = Math.sin(t * 0.6) * 0.06; head.rotation.x = Math.sin(t * 0.9) * 0.025; }
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
frame();

// ---- आवाज़ में जवाब ----
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "hi-IN";
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("hi"));
  if (v) u.voice = v;
  u.onstart = () => { speaking = true; document.body.classList.add("talk"); };
  u.onend = u.onerror = () => { speaking = false; document.body.classList.remove("talk"); };
  speechSynthesis.speak(u);
}

// ---- Gemini से बात ----
async function ask(text) {
  if (!text.trim()) return;
  add("user", text);
  history.push({ role: "user", parts: [{ text }] });
  status.textContent = "सोच रही हूँ…";
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: PERSONA }] }, contents: history.slice(-20) })
    });
    const data = await r.json();
    const reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") ||
      ("जवाब नहीं मिला। " + (data?.error?.message || ""));
    add("model", reply);
    history.push({ role: "model", parts: [{ text: reply }] });
    save();
    speak(reply);
  } catch (e) {
    add("model", "कनेक्शन में दिक्कत है। Worker का लिंक और इंटरनेट जाँचें।");
    history.pop();
  }
  status.textContent = "";
}
$("send").onclick = () => { const t = txt.value; txt.value = ""; ask(t); };
txt.addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });

// ---- बोलकर पूछना ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { mic.style.display = "none"; }
else {
  const rec = new SR();
  rec.lang = "hi-IN";
  rec.onstart = () => { mic.classList.add("on"); status.textContent = "सुन रही हूँ…"; };
  rec.onend = () => { mic.classList.remove("on"); if (status.textContent === "सुन रही हूँ…") status.textContent = ""; };
  rec.onerror = () => { status.textContent = "माइक की अनुमति दें या लिखकर पूछें।"; };
  rec.onresult = e => ask(e.results[0][0].transcript);
  mic.onclick = () => { speechSynthesis.cancel(); try { rec.start(); } catch (e) {} };
}
</script>
</body>
</html>
