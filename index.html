<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miya AI Assistant</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; }
        
        /* Default Miya Theme */
        .miya-theme { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #333; }
        .thron-theme { background: #000; color: #0f0; font-family: 'Courier New', monospace; }

        /* Main Interface */
        #main-ui { display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        #mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: rgba(255,255,255,0.2); cursor: pointer; font-size: 24px; }
        
        /* Tool Overlays (Hidden by default) */
        .tool-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; padding: 20px; box-sizing: border-box; }
        
        /* Specific Tool Styles */
        #camera-feed { width: 100%; height: 70%; object-fit: cover; border: 2px solid #fff; }
        #network-log { font-size: 12px; color: #0f0; overflow-y: auto; height: 70%; }
        #dos-bar { width: 100%; height: 20px; background: #333; margin-top: 10px; }
        #dos-fill { width: 0%; height: 100%; background: red; transition: width 0.1s; }

        .close-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body class="miya-theme">

    <!-- Main Voice Interface -->
    <div id="main-ui">
        <button id="mic-btn" onclick="startListening()">🎤</button>
        <p id="status-text">Tap or Say Command...</p>
    </div>

    <!-- Spy Camera Overlay -->
    <div id="spy-panel" class="tool-overlay">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>Spy Mode Active</h2>
        <video id="camera-feed" autoplay playsinline></video>
        <p>Recording... 📹</p>
    </div>

    <!-- Network Scanner Overlay -->
    <div id="network-panel" class="tool-overlay thron-theme">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>Network Scan</h2>
        <div id="network-log">Scanning nearby devices...</div>
    </div>

    <!-- DoS Attack Overlay -->
    <div id="dos-panel" class="tool-overlay thron-theme">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>DoS Attack Simulation</h2>
        <div id="dos-bar"><div id="dos-fill"></div></div>
        <p id="dos-status">Packets sent: 0</p>
    </div>

    <script>
        // --- Configuration ---
        const commands = {
            "miya spy karo": "openCamera",
            "thron network scan": "scanNetwork",
            "scrape data": "scrapeData",
            "start dos attack": "startDos"
        };

        let recognition;
        let isListening = false;

        // --- Voice Recognition Setup ---
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'en-IN'; // Supports Hindi/English mix
            
            recognition.onresult = function(event) {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript.toLowerCase().trim();
                document.getElementById('status-text').innerText = `Heard: "${transcript}"`;
                
                // Check for commands
                for (let cmd in commands) {
                    if (transcript.includes(cmd)) {
                        executeTool(commands[cmd]);
                        break;
                    }
                }
            };
            
            recognition.start();
        } else {
            alert("Browser supports Voice but not Speech Recognition.");
        }

        // --- Tool Functions ---
        function executeTool(toolName) {
            closeTools(); // Close any open panel first
            const status = document.getElementById('status-text');
            
            if (toolName === "openCamera") {
                document.body.className = "miya-theme";
                status.innerText = "Opening Camera...";
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        document.getElementById('camera-feed').srcObject = stream;
                        document.getElementById('spy-panel').style.display = 'block';
                    })
                    .catch(err => alert("Camera access denied"));
            } 
            else if (toolName === "scanNetwork") {
                document.body.className = "thron-theme";
                status.innerText = "Scanning Network...";
                document.getElementById('network-panel').style.display = 'block';
                simulateLog("network-log", ["Found: 192.168.1.1", "Found: 192.168.1.45", "Encrypting...", "Scan Complete"]);
            }
            else if (toolName === "scrapeData") {
                status.innerText = "Scraping Data...";
                // Simulating scrape with a fetch
                fetch('https://jsonplaceholder.typicode.com/posts/1')
                    .then(response => response.json())
                    .then(data => alert("Scraped Data: " + JSON.stringify(data)));
            }
            else if (toolName === "startDos") {
                document.body.className = "thron-theme";
                status.innerText = "Initiating DoS...";
                document.getElementById('dos-panel').style.display = 'block';
                let width = 0;
                const interval = setInterval(() => {
                    if (width >= 100) clearInterval(interval);
                    else width++;
                    document.getElementById('dos-fill').style.width = width + '%';
                    document.getElementById('dos-status').innerText = `Packets sent: ${width * 100}`;
                }, 50);
            }
        }

        function closeTools() {
            document.querySelectorAll('.tool-overlay').forEach(el => el.style.display = 'none');
            document.getElementById('status-text').innerText = "Standby...";
        }

        function startListening() {
            if(!isListening) {
                recognition.start();
                isListening = true;
                document.getElementById('mic-btn').style.background = "red";
            }
        }

        // Helper to simulate logging
        function simulateLog(elementId, messages) {
            const log = document.getElementById(elementId);
            let i = 0;
            const interval = setInterval(() => {
                if (i >= messages.length) clearInterval(interval);
                else {
                    log.innerHTML += `<div>> ${messages[i]}</div>`;
                    i++;
                }
            }, 1000);
        }
    </script>
</body>
</html>
