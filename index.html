<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Miya AI System v3</title>
<style>
body{margin:0;font-family:'Courier New',monospace;background:#000;color:#0f0;overflow:hidden;touch-action:manipulation}
#main-ui{display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;flex-direction:column;padding:20px;box-sizing:border-box;overflow-y:auto}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;margin-top:20px}
.ctrl-btn{background:#222;border:1px solid #0f0;color:#0f0;padding:15px;font-size:14px;cursor:pointer;border-radius:5px}
.ctrl-btn:active{background:#0f0;color:#000}
#mic-btn{width:80px;height:80px;border-radius:50%;border:2px solid #0f0;background:transparent;color:#0f0;font-size:30px;cursor:pointer;box-shadow:0 0 10px #0f0;margin-bottom:20px;outline:none;flex-shrink:0}
#mic-btn:active{background:#0f0;color:#000}
#status-text{margin-top:20px;font-size:14px;opacity:.8;word-break:break-all;padding:0 10px}
.tool-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:100;display:none;padding:20px;box-sizing:border-box;flex-direction:column;justify-content:center;align-items:center}
#camera-feed{width:100%;max-height:60vh;object-fit:cover;border:2px solid #0f0;background:#111}
#network-log,#scrape-log,#custom-out{font-size:12px;color:#0f0;overflow-y:auto;width:100%;max-width:400px;height:50vh;border:1px solid #333;padding:10px;background:#111;text-align:left;box-sizing:border-box}
#dos-bar{width:100%;max-width:400px;height:20px;background:#333;margin-top:10px;border:1px solid #0f0}
#dos-fill{width:0%;height:100%;background:red;transition:width .1s}
.close-btn{position:absolute;top:20px;right:20px;background:red;color:#fff;border:none;padding:10px 20px;cursor:pointer;font-weight:bold;z-index:101;border-radius:5px}
/* Brain */
#brain-panel{justify-content:flex-start;overflow-y:auto;padding-top:70px}
#brain-panel>*{width:100%;max-width:420px;box-sizing:border-box}
.in{background:#111;border:1px solid #0f0;color:#0f0;padding:10px;font:13px 'Courier New',monospace;margin:4px 0;border-radius:4px}
textarea.in{height:90px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sm{background:#222;border:1px solid #0f0;color:#0f0;padding:9px 10px;font:12px 'Courier New',monospace;border-radius:4px}
.sm:active{background:#0f0;color:#000}
#plan-box{display:none;border:1px solid #ff0;color:#ff0;padding:10px;margin:8px 0;text-align:left;font-size:12px;white-space:pre-wrap;word-break:break-word}
#brain-log{font-size:11px;height:110px;overflow-y:auto;border:1px solid #333;background:#111;padding:8px;text-align:left}
.tool-item{border:1px solid #0a0;padding:8px;margin:6px 0;text-align:left;font-size:12px}
.off{opacity:.45}
</style>
</head>
<body>

<div id="main-ui">
  <button id="mic-btn" onclick="startListening()">🎤</button>
  <p id="status-text">System Ready... Tap Mic or Use Buttons Below</p>
  <div class="row" style="width:100%;max-width:300px">
    <input class="in" id="cmd-input" placeholder="Command type karo..." style="flex:1;margin:0" onkeydown="if(event.key==='Enter')runTyped()">
    <button class="sm" onclick="runTyped()" style="margin:0">▶</button>
  </div>
  <div class="controls" id="controls">
    <button class="ctrl-btn" onclick="executeTool('openCamera')">📷 Spy Cam</button>
    <button class="ctrl-btn" onclick="executeTool('scanNetwork')">📡 Scan Net</button>
    <button class="ctrl-btn" onclick="executeTool('startDos')">⚠️ DoS Sim</button>
    <button class="ctrl-btn" onclick="executeTool('scrapeData')">🕸️ Scrape Data</button>
    <button class="ctrl-btn" onclick="executeTool('openBrain')" style="grid-column:span 2">🧠 Brain (Add Tool)</button>
    <button class="ctrl-btn" onclick="executeTool('webSearch')">🔎 Web Search</button>
    <button class="ctrl-btn" onclick="executeTool('secConcepts')">🎓 Security Concepts</button>
    <button class="ctrl-btn" onclick="executeTool('aboutSelf')" style="grid-column:span 2">ℹ️ Mere andar kya hai?</button>
  </div>
  <div class="controls" id="custom-controls" style="margin-top:10px"></div>
</div>

<div id="spy-panel" class="tool-overlay">
  <button class="close-btn" onclick="closeTools()">X</button>
  <h2>📷 SPY MODE ACTIVE</h2>
  <video id="camera-feed" autoplay playsinline muted></video>
  <p style="margin-top:15px">Live preview 🟢</p>
</div>

<div id="network-panel" class="tool-overlay">
  <button class="close-btn" onclick="closeTools()">X</button>
  <h2>📡 NETWORK SCAN</h2>
  <div id="network-log">Initializing scan...</div>
</div>

<div id="dos-panel" class="tool-overlay">
  <button class="close-btn" onclick="closeTools()">X</button>
  <h2>⚠️ DOS ATTACK SIMULATION</h2>
  <div id="dos-bar"><div id="dos-fill"></div></div>
  <p id="dos-status">Packets sent: 0</p>
</div>

<div id="scrape-panel" class="tool-overlay">
  <button class="close-btn" onclick="closeTools()">X</button>
  <h2>🕸️ DATA SCRAPING</h2>
  <div id="scrape-log">Connecting to API...</div>
</div>

<!-- Custom tool output -->
<div id="custom-panel" class="tool-overlay">
  <button class="close-btn" onclick="closeTools()">X</button>
  <h2 id="custom-title">Tool</h2>
  <div id="custom-out"></div>
</div>

<!-- Brain -->
<div id="brain-panel" class="tool-overlay">
  <button class="close-btn" onclick="closeTools()">X</button>
  <h2 style="margin:0 0 8px">🧠 MIYA BRAIN</h2>
  <input class="in" id="b-key" type="password" placeholder="API key (OPTIONAL — khali chhodo to Miya bina AI ke khud seekhegi)" style="width:100%">
  <input class="in" id="b-req" placeholder="Kaunsa tool chahiye? (ya tool ka naam)" style="width:100%">
  <textarea class="in" id="b-code" placeholder="Ya apna code yahan paste karo (tool body, `miya` object use kar sakte ho)" style="width:100%"></textarea>
  <div class="row">
    <button class="sm" onclick="makePlan()">📝 Plan banao (AI)</button>
    <button class="sm" onclick="learnCode()">💾 Code seekho</button>
    <button class="sm" onclick="whereBtn()">🧭 Kahan dalu?</button>
    <button class="sm" onclick="chgPass()">🔑 Password</button>
  </div>
  <div id="plan-box"></div>
  <div class="row" id="plan-btns" style="display:none">
    <button class="sm" onclick="approve()">✅ Add karo</button>
    <button class="sm" onclick="reject()">❌ Cancel</button>
  </div>
  <div id="tool-list"></div>
  <div id="brain-log">Brain ready.</div>
</div>

<script>
// ---------- Core ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const commands = {"miya spy karo":"openCamera","scan network":"scanNetwork","scrape data":"scrapeData","start dos attack":"startDos","open brain":"openBrain","khud ke baare me batao":"aboutSelf","about yourself":"aboutSelf","web search":"webSearch","security concepts":"secConcepts","ethical hacking":"secConcepts","stop":"closeTools"};
// Har built-in command ka ek-line kaam, selfInfo() isi se padhta hai
const CMD_DESC = {
  openCamera:'Camera on karke live preview dikhata hai',
  scanNetwork:'Fake network device list print karta hai (simulation)',
  scrapeData:'Fake data-scrape log dikhata hai (simulation)',
  startDos:'DoS progress bar bharta hai, kuch bhejta nahi (simulation)',
  openBrain:'Naya tool add/seekhne/fix karne ka panel kholta hai',
  aboutSelf:'Khud ke tools aur commands ki list sunata/dikhata hai',
  webSearch:'Google par query search karta hai (naye tab me)',
  secConcepts:'Security concepts sirf samajh/bachav ke nazariye se dikhata hai, attack commands nahi deta',
  closeTools:'Jo bhi panel khula hai usse band karta hai'
};

// ---- Dono entry points (typing + voice) isi ek function se guzarte hain ----
function routeCommand(raw){
  const t = String(raw || '').toLowerCase().trim();
  if(!t) return;
  $('status-text').innerText = `Command: "${t}"`;
  if(t.startsWith('search ') || t.startsWith('search for ')){
    webSearch(t.replace(/^search( for)?\s*/, ''));
    return;
  }
  for(const c in commands){ if(t.includes(c)){ executeTool(commands[c]); return; } }
  const ct = tools.find(x => x.enabled && x.trigger && t.includes(x.trigger));
  if(ct){ runTool(ct); return; }
  speak("Command not recognized");
  $('status-text').innerText = `Samajh nahi aaya: "${t}"`;
}
function runTyped(){
  const v = $('cmd-input').value;
  $('cmd-input').value = '';
  routeCommand(v);
}
let recognition, mediaStream = null, activeIntervals = [], closeHooks = [];

function clearAllIntervals(){ activeIntervals.forEach(clearInterval); activeIntervals = []; }

function startListening(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ alert("Voice recognition not supported. Use Chrome."); return; }
  try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-IN';
    $('status-text').innerText = "Listening... Speak now 🎙️";
    recognition.onresult = e => {
      const t = e.results[0][0].transcript;
      routeCommand(t);
    };
    recognition.onerror = e => { $('status-text').innerText = "Mic Error: " + e.error; };
    recognition.onend = () => { $('status-text').innerText = "System Idle. Tap Mic."; };
    recognition.start();
  }catch(err){ $('status-text').innerText = "Speech init failed: " + err.message; }
}

function executeTool(name){
  closeTools();
  switch(name){
    case "openCamera": startCamera(); speak("Spy Mode Activated"); break;
    case "scanNetwork": openPanel('network-panel'); simulateScan(); speak("Scanning local network"); break;
    case "scrapeData": openPanel('scrape-panel'); simulateScrape(); speak("Starting data scrape"); break;
    case "startDos": openPanel('dos-panel'); simulateDos(); speak("Initiating DoS attack simulation"); break;
    case "openBrain": openPanel('brain-panel'); render(); break;
    case "aboutSelf": aboutSelf(); break;
    case "webSearch": { const q = prompt('Kya search karna hai?'); if(q) webSearch(q); break; }
    case "secConcepts": secConcepts(); break;
    case "closeTools": closeTools(); break;
  }
}
function openPanel(id){ $(id).style.display = 'flex'; }
function closeTools(){
  clearAllIntervals();
  closeHooks.forEach(f => { try{ f(); }catch(e){} }); closeHooks = [];
  document.querySelectorAll('.tool-overlay').forEach(el => el.style.display = 'none');
  stopCamera();
  $('status-text').innerText = "System Idle";
}
function speak(text){
  if('speechSynthesis' in window){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
}

// ---------- Built-in tools (original) ----------
async function startCamera(){
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    $('camera-feed').srcObject = mediaStream; openPanel('spy-panel');
  }catch(err){ $('status-text').innerText = "Camera Access Denied or Not Supported."; alert("Camera permission required."); }
}
function stopCamera(){
  if(mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  $('camera-feed').srcObject = null;
}
function simulateScan(){
  const log = $('network-log'); log.innerHTML = "Initializing scan...";
  const d = ["Router: 192.168.1.1","Phone: 192.168.1.5","Laptop: 192.168.1.12","IoT Device: 192.168.1.20"]; let i = 0;
  const iv = setInterval(() => {
    if(i >= d.length){ clearInterval(iv); log.innerHTML += "<br><br><b>Scan Complete. All devices secure.</b>"; return; }
    log.innerHTML += `<br>> Found: ${d[i]}`; log.scrollTop = log.scrollHeight; i++;
  }, 1000);
  activeIntervals.push(iv);
}
function simulateDos(){
  const fill = $('dos-fill'), st = $('dos-status'); fill.style.width = '0%'; let p = 0;
  const iv = setInterval(() => {
    p += Math.floor(Math.random()*2500) + 500;
    fill.style.width = Math.min(p/50000*100, 100) + '%'; st.innerText = `Packets sent: ${p}`;
    if(p >= 50000){ clearInterval(iv); st.innerText = "Simulation Completed Successfully"; }
  }, 100);
  activeIntervals.push(iv);
}
function simulateScrape(){
  const log = $('scrape-log'); log.innerHTML = "Connecting to API endpoints...";
  const d = ["Target: local_database.db","Fetching User Profiles...","Email: user@example.com","Session Token: xyz-9876-token","Extraction Successful."]; let i = 0;
  const iv = setInterval(() => {
    if(i >= d.length){ clearInterval(iv); log.innerHTML += "<br><br><b>Scraping Finished.</b>"; return; }
    log.innerHTML += `<br>> Extracted: ${d[i]}`; log.scrollTop = log.scrollHeight; i++;
  }, 800);
  activeIntervals.push(iv);
}

// ---------- Web Search ----------
function webSearch(q){
  q = String(q || '').trim();
  if(!q){ speak('Kya search karu, bolo'); return; }
  window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
  speak('Search kar rahi hoon: ' + q);
  $('status-text').innerText = 'Searched: ' + q;
}

// ---------- Security Concepts (sirf samajh/bachav, attack commands kabhi nahi) ----------
function secConcepts(){
  const h = `<h3 style="margin-top:0">🎓 Security Concepts (defense-only)</h3>
  <p><b>DoS (Denial of Service):</b> ek server ko itne saare fake requests bhej dena ki wo asli users ke liye kaam karna band kar de. Bachav: rate-limiting, firewall, CDN jaise Cloudflare.</p>
  <p><b>Phishing:</b> fake login page ya message se kisi ka password/OTP churane ki koshish. Bachav: URL dhyan se dekho, 2FA on rakho, unknown link na kholo.</p>
  <p><b>Malware:</b> aisa software jo bina permission ke device me ghus kar data churaye ya nuksan kare. Bachav: sirf trusted source se app install karo, permissions check karo.</p>
  <p><b>Network Scanning:</b> network par kaun se devices/ports khule hain ye dekhna. Defensive use: khud ke network ko audit karna, unused ports band karna.</p>
  <p><b>Password Security:</b> lamba, unique password, password manager, har jagah same password na use karo.</p>
  <p style="opacity:.7">Ye sab sirf samajhne aur khud ko bachane ke liye hai — Miya kisi bhi real attack command, exploit code, ya kisi aur ke system par chalane wala script kabhi nahi degi.</p>`;
  miya.show(h, '🎓 Security Concepts');
  speak('Ye concepts sirf samajh aur bachav ke liye hain, main asli attack command kabhi nahi deti');
}

// ---------- Brain: learnable tools ----------
let tools = []; try{ tools = JSON.parse(localStorage.getItem('miya_tools') || '[]'); }catch(e){}
let apiKey = localStorage.getItem('miya_key') || '';
let pending = null;
const saveTools = () => localStorage.setItem('miya_tools', JSON.stringify(tools));
function blog(t){ const l = $('brain-log'); l.innerHTML += '<br>> ' + esc(t); l.scrollTop = l.scrollHeight; }

// API jo har custom tool ko milti hai
const miya = {
  speak,
  log: t => blog(String(t)),
  show: (html, title) => { $('custom-title').innerText = title || 'Tool'; $('custom-out').innerHTML = html; openPanel('custom-panel'); },
  onClose: fn => closeHooks.push(fn),
  interval: (fn, ms, tool) => {
    const iv = setInterval(async () => { try{ await fn(); }catch(e){ clearInterval(iv); if(tool) onFail(tool, e); } }, ms);
    activeIntervals.push(iv); return iv;
  }
};

const SYS = `You write tools for Miya, a voice assistant that is a single HTML page in a phone browser. A tool is the BODY of an async JS function with one parameter "miya": miya.speak(text), miya.log(text), miya.show(html,title) opens a fullscreen panel, miya.interval(fn,ms) for timers, miya.onClose(fn) for cleanup. Use only standard browser APIs. Keep code short and robust. Reply with ONLY JSON, no markdown.`;

async function ai(prompt){
  if(!apiKey) throw new Error('API key nahi hai (Brain me daalo)');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:2000, system:SYS, messages:[{role:'user',content:prompt}]})
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return JSON.parse(d.content.map(c => c.text || '').join('').replace(/```json|```/g,'').trim());
}

// ---- Author password ----
const AUTHOR_PASSWORD = ""; // <-- yahan apna password likho. Khali rakha to pehli baar app khud set karwayega.
let authed = false;
async function sha(s){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h = 5381; for(const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h; }
}
async function auth(){
  if(authed) return true;
  const saved = localStorage.getItem('miya_ph');
  if(!AUTHOR_PASSWORD && !saved){
    const n = prompt('Pehli baar: naya author password set karo'); if(!n) return false;
    localStorage.setItem('miya_ph', await sha(n)); authed = true; blog('🔑 Password set ho gaya'); return true;
  }
  const p = prompt('Author password?'); if(!p) return false;
  if((AUTHOR_PASSWORD && p === AUTHOR_PASSWORD) || (saved && await sha(p) === saved)){ authed = true; return true; }
  blog('❌ Galat password'); return false;
}
async function chgPass(){
  authed = false; if(!await auth()) return;
  if(AUTHOR_PASSWORD){ blog('Password code me AUTHOR_PASSWORD se badlo'); return; }
  const n = prompt('Naya password?'); if(n){ localStorage.setItem('miya_ph', await sha(n)); blog('🔑 Password badal gaya'); }
}

// ---- Local coding brain (bina internet / bina AI) ----
const LOCAL = [
 {k:['time','clock','samay','ghadi'],name:'Clock',code:`const f=()=>miya.show('<h1 style="font-size:40px">'+new Date().toLocaleTimeString()+'</h1>','Clock');f();miya.interval(f,1000);`},
 {k:['timer','countdown'],name:'Timer',code:`let n=10;const f=()=>miya.show('<h1 style="font-size:60px">'+n+'</h1>','Timer');f();const iv=miya.interval(()=>{n--;f();if(n<=0){clearInterval(iv);miya.speak('Time up');}},1000);`},
 {k:['battery','charge'],name:'Battery',code:`const b=await navigator.getBattery();miya.show('<h1>'+Math.round(b.level*100)+'%</h1>'+(b.charging?'Charging':'Not charging'),'Battery');`},
 {k:['vibrate','vibration'],name:'Vibrate',code:`if(navigator.vibrate)navigator.vibrate([200,100,200]);miya.speak('Vibrating');`},
 {k:['note','notes','yaad'],name:'Notes',code:`miya.show('<textarea id="nt" style="width:100%;height:100%;background:#000;color:#0f0;border:0" oninput="localStorage.setItem(\\'miya_note\\',this.value)"></textarea>','Notes');document.getElementById('nt').value=localStorage.getItem('miya_note')||'';`},
 {k:['dice','random','number'],name:'Dice',code:`const n=Math.floor(Math.random()*6)+1;miya.show('<h1 style="font-size:80px">'+n+'</h1>','Dice');miya.speak('You got '+n);`},
 {k:['location','gps','where'],name:'Location',code:`const p=await new Promise((a,b)=>navigator.geolocation.getCurrentPosition(a,b));miya.show('Lat: '+p.coords.latitude+'<br>Lon: '+p.coords.longitude,'Location');`}
];
let mem = []; try{ mem = JSON.parse(localStorage.getItem('miya_mem') || '[]'); }catch(e){}
const words = t => [...new Set(String(t).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2))];
function localBrain(req){
  const r = req.toLowerCase(); let best = null, bs = 0;
  for(const c of mem.concat(LOCAL)){ const sc = c.k.filter(k => r.includes(k)).length; if(sc > bs){ bs = sc; best = c; } }
  return best;
}
function learn(t){ // approved tool ko yaad rakho
  mem = mem.filter(m => m.name !== t.name);
  mem.push({k:words(t.name + ' ' + t.trigger), name:t.name, code:t.code});
  localStorage.setItem('miya_mem', JSON.stringify(mem));
}

// ---- Placement brain: tool pehchano + jagah batao ----
const MAP = `FILE MAP (sab kuch sirf index.html me):
• <style> = look, <body> = buttons/panels, <script> = logic.
• Naya tool (miya object use karta ho) -> Brain list me jata hai, file nahi badalni.
• Built-in tool (apna panel/function) -> 3 jagah: (1) <div class="controls"> me button, (2) executeTool() switch me case, (3) <script> me function.
• Voice command built-in ho to commands{} me phrase bhi jodo.
• Password: AUTHOR_PASSWORD (script ke upar wala hissa).`;
const CATS = [
 {c:'🕶️ Hacking/Security',k:['hack','scan','network','packet','dos','exploit','port','scrape','spy','wifi','sniff','crack','nmap','pentest']},
 {c:'💻 Coding',k:['coding','compile','debug','script','html','json','regex','format','editor','snippet','terminal']},
 {c:'📷 Media',k:['camera','photo','video','audio','music','mic','record','image']},
 {c:'⚙️ System',k:['battery','vibrate','location','gps','clock','time','timer','storage','device','note','dice']}
];
function place(code, req){
  const t = (req + ' ' + code).toLowerCase(); let cat = '🧩 Other', bs = 0;
  for(const c of CATS){ const sc = c.k.filter(k => t.includes(k)).length; if(sc > bs){ bs = sc; cat = c.c; } }
  const builtin = /\bfunction\s+\w+\s*\(|document\.getElementById|<div|addEventListener/.test(code);
  const where = builtin
    ? 'Ye built-in jaisa hai: index.html me 3 jagah (controls button + executeTool case + script function). Ya isse tool-body bana kar yahin Brain se add karo.'
    : 'Brain ki tool list me jayega, file badalne ki zaroorat nahi. Button aur voice trigger khud ban jayega.';
  return {cat, where, builtin};
}
function whereBtn(){
  const code = $('b-code').value, req = $('b-req').value;
  const p = place(code, req);
  blog(`Category: ${p.cat}`); blog(p.where); blog(MAP);
}

function keepKey(){ const k = $('b-key').value.trim(); if(k){ apiKey = k; localStorage.setItem('miya_key', k); $('b-key').value = ''; } }

async function makePlan(){
  if(!await auth()) return;
  keepKey();
  const req = $('b-req').value.trim();
  if(!req){ blog('Pehle batao kaunsa tool chahiye'); return; }
  if(apiKey){
    blog('Plan ban raha hai (AI)...');
    try{
      const r = await ai(`User wants a new tool: "${req}". Return {"name":"short name","trigger":"lowercase English voice phrase","plan":"3-5 short steps in Hinglish","code":"tool body"}`);
      showPlan({name:r.name, trigger:(r.trigger||r.name).toLowerCase(), code:r.code}, r.plan);
    }catch(e){ blog('❌ ' + e.message); }
    return;
  }
  const m = localBrain(req);
  if(!m){ blog('🤷 Ye abhi seekha nahi. Code paste karke "Code seekho" dabao, main yaad rakhunga.'); return; }
  showPlan({name:m.name, trigger:req.toLowerCase(), code:m.code}, `1. Mere yaad kiye "${m.name}" se match hua\n2. Approve par add + test run\n3. Fail hua to last working version par wapas`);
}

async function learnCode(){
  if(!await auth()) return;
  const code = $('b-code').value.trim(), name = $('b-req').value.trim() || 'tool' + (tools.length + 1);
  if(!code){ blog('Code paste karo'); return; }
  try{ new Function('miya', `return (async()=>{${code}\n})()`); }
  catch(e){ blog('❌ Syntax error: ' + e.message + ' — code theek karke dobara bhejo'); return; }
  showPlan({name, trigger:name.toLowerCase(), code}, `1. Code as-is save hoga\n2. Trigger phrase: "${name.toLowerCase()}"\n3. Test run hoga, fail hua to disable ho jayega`);
}

function showPlan(t, plan){
  pending = t;
  $('plan-box').style.display = 'block';
  const pl = place(t.code, t.name + ' ' + t.trigger); t.cat = pl.cat;
  $('plan-box').textContent = `Tool: ${t.name}\nCategory: ${pl.cat}\nJagah: ${pl.where}\nBolo: "${t.trigger}"\n\n${plan}\n\n--- code ---\n${t.code}`;
  $('plan-btns').style.display = 'flex';
  blog('Plan ready. Approve karoge?');
}
function reject(){ pending = null; $('plan-box').style.display = 'none'; $('plan-btns').style.display = 'none'; blog('Cancelled.'); }
async function approve(){
  if(!pending || !await auth()) return;
  const t = {id:Date.now(), name:pending.name, trigger:pending.trigger, code:pending.code, history:[], enabled:true, tries:0, cat:pending.cat};
  tools.push(t); saveTools(); learn(t); pending = null; reject(); render(); blog('✅ Added: ' + t.name);
  speak(t.name + " added"); runTool(t);
}

async function runTool(t){
  closeTools();
  try{
    const f = new Function('miya', `return (async()=>{${t.code}\n})()`);
    const m = Object.assign({}, miya, {interval:(fn, ms) => miya.interval(fn, ms, t)});
    await f(m); t.tries = 0; t.rb = false; t.good = t.code; saveTools();
  }catch(e){ openPanel('brain-panel'); await onFail(t, e); }
}

// Kharab hua to: AI se fix (max 2 try), warna disable
async function onFail(t, e){
  blog(`❌ ${t.name}: ${e.message}`);
  if(t.good && t.good !== t.code && !t.rb){ // pehle last working version par wapas
    t.history.push(t.code); t.code = t.good; t.rb = true; saveTools(); render();
    blog('↩️ Last working version par wapas, dobara chala raha hoon');
    return runTool(t);
  }
  if(apiKey && (t.tries || 0) < 2){
    t.tries = (t.tries || 0) + 1; blog('🔧 Fix kar raha hoon (' + t.tries + '/2)...');
    try{
      const r = await ai(`This tool failed.\nError: ${e.message}\nCode:\n${t.code}\nReturn {"code":"fixed full tool body"}`);
      t.history.push(t.code); t.code = r.code; saveTools(); render(); blog('Fix lag gaya, dobara chala raha hoon');
      return runTool(t);
    }catch(x){ blog('Fix fail: ' + x.message); }
  } else if(!apiKey){ blog('Naya/sahi code paste karke "Code seekho" karo, main use yaad rakh lunga.'); }
  t.enabled = false; saveTools(); render(); speak(t.name + " disabled");
}

async function act(a, i){
  const t = tools[i]; if(!t) return;
  if(a !== 'run' && !await auth()) return;
  if(a === 'run'){ t.enabled = true; t.tries = 0; runTool(t); }
  if(a === 'fix'){ t.tries = 0; onFail(t, new Error($('b-req').value.trim() || 'User says it is broken or needs improvement')); }
  if(a === 'undo' && t.history.length){ t.code = t.history.pop(); t.enabled = true; blog('↩️ Purana version wapas'); }
  if(a === 'del'){ if(!confirm('Delete ' + t.name + '?')) return; tools.splice(i, 1); }
  saveTools(); render();
}

// ---- Khud ke baare me (code se hi padhkar banta hai, hardcoded jawab nahi) ----
function aboutSelf(){
  let h = '<h3 style="margin-top:0">🎙️ Voice Commands (built-in)</h3><ul style="padding-left:18px">';
  for(const phrase in commands){
    const fn = commands[phrase];
    h += `<li><b>"${esc(phrase)}"</b> → ${esc(CMD_DESC[fn] || fn)}</li>`;
  }
  h += '</ul><h3>🧩 Built-in Tools (panel wale)</h3><ul style="padding-left:18px">';
  h += '<li>📷 Spy Cam — camera live preview (simulation, recording nahi karta)</li>';
  h += '<li>📡 Scan Net — fake device list (simulation)</li>';
  h += '<li>⚠️ DoS Sim — progress bar, kuch bhejta nahi (simulation)</li>';
  h += '<li>🕸️ Scrape Data — fake extracted data log (simulation)</li></ul>';
  h += '<h3>🧠 Local Brain Templates (bina AI ke)</h3><ul style="padding-left:18px">';
  LOCAL.forEach(c => h += `<li><b>${esc(c.name)}</b> — keywords: ${esc(c.k.join(', '))}</li>`);
  h += '</ul>';
  if(tools.length){
    h += '<h3>🔧 Seekhe hue tools (' + tools.length + ')</h3><ul style="padding-left:18px">';
    tools.forEach(t => h += `<li><b>${esc(t.name)}</b> [${esc(t.cat || '')}] — bolo: "${esc(t.trigger)}" ${t.enabled ? '' : '(disabled)'}</li>`);
    h += '</ul>';
  } else {
    h += '<p>Abhi koi custom tool nahi seekha.</p>';
  }
  h += '<h3>📂 File ka structure</h3><p>&lt;style&gt; = look · &lt;body&gt; = buttons/panels · &lt;script&gt; = sab logic (voice, tools, Brain, password, placement)</p>';
  miya.show(h, 'ℹ️ Mere andar kya hai');
  speak(`Mere paas ${Object.keys(commands).length} built-in commands aur ${tools.length} seekhe hue tools hain`);
}

function render(){
  $('tool-list').innerHTML = tools.map((t, i) => `<div class="tool-item ${t.enabled ? '' : 'off'}">
    <b>${esc(t.name)}</b> <small>${esc(t.cat || '')}</small> — bolo: "${esc(t.trigger)}" ${t.enabled ? '' : '(disabled)'}
    <div class="row">
      <button class="sm" onclick="act('run',${i})">▶ Run</button>
      <button class="sm" onclick="act('fix',${i})">🔧 Fix</button>
      <button class="sm" onclick="act('undo',${i})">↩ Undo</button>
      <button class="sm" onclick="act('del',${i})">🗑</button>
    </div></div>`).join('');
  const g = {};
  tools.forEach((t, i) => {
    if(!t.enabled) return;
    if(!t.cat) t.cat = place(t.code, t.name).cat;
    (g[t.cat] = g[t.cat] || []).push(`<button class="ctrl-btn" onclick="act('run',${i})">🧩 ${esc(t.name)}</button>`);
  });
  $('custom-controls').innerHTML = Object.entries(g).map(([c, b]) =>
    `<div style="grid-column:span 2;text-align:left;font-size:12px;opacity:.7">${esc(c)}</div>` + b.join('')).join('');
}
render();
</script>
