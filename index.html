<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miya AI System v2</title>
    <style>
        body { 
            margin: 0; font-family: 'Courier New', monospace; background: #000; color: #0f0; overflow: hidden; 
            touch-action: manipulation;
        }
        
        /* Main Interface */
        #main-ui { display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        /* Control Buttons */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 300px; margin-top: 20px; }
        .ctrl-btn { background: #222; border: 1px solid #0f0; color: #0f0; padding: 15px; font-size: 14px; cursor: pointer; border-radius: 5px; }
        .ctrl-btn:active { background: #0f0; color: #000; }

        #mic-btn { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #0f0; background: transparent; color: #0f0; font-size: 30px; cursor: pointer; box-shadow: 0 0 10px #0f0; margin-bottom: 20px; outline: none; }
        #mic-btn:active { background: #0f0; color: #000; }

        #status-text { margin-top: 20px; font-size: 14px; opacity: 0.8; word-break: break-all; padding: 0 10px; }

        /* Tool Overlays */
        .tool-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: none; padding: 20px; box-sizing: border-box; flex-direction: column; justify-content: center; align-items: center; }
        
        /* Camera Styles */
        #camera-feed { width: 100%; max-height: 60vh; object-fit: cover; border: 2px solid #0f0; background: #111; }
        
        /* Logs */
        #network-log, #scrape-log { font-size: 12px; color: #0f0; overflow-y: auto; width: 100%; max-width: 400px; height: 50vh; border: 1px solid #333; padding: 10px; background: #111; text-align: left; box-sizing: border-box; }
        
        /* DoS Styles */
        #dos-bar { width: 100%; max-width: 400px; height: 20px; background: #333; margin-top: 10px; border: 1px solid #0f0; }
        #dos-fill { width: 0%; height: 100%; background: red; transition: width 0.1s; }

        .close-btn { position: absolute; top: 20px; right: 20px; background: red; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; z-index: 101; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Main Interface -->
    <div id="main-ui">
        <button id="mic-btn" onclick="startListening()">🎤</button>
        <p id="status-text">System Ready... Tap Mic or Use Buttons Below</p>
        
        <!-- Manual Controls -->
        <div class="controls">
            <button class="ctrl-btn" onclick="executeTool('openCamera')">📷 Spy Cam</button>
            <button class="ctrl-btn" onclick="executeTool('scanNetwork')">📡 Scan Net</button>
            <button class="ctrl-btn" onclick="executeTool('startDos')">⚠️ DoS Sim</button>
            <button class="ctrl-btn" onclick="executeTool('scrapeData')">🕸️ Scrape Data</button>
        </div>
    </div>

    <!-- Spy Camera Overlay -->
    <div id="spy-panel" class="tool-overlay">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>📷 SPY MODE ACTIVE</h2>
        <video id="camera-feed" autoplay playsinline muted></video>
        <p style="margin-top: 15px;">Recording... 🟢</p>
    </div>

    <!-- Network Scanner Overlay -->
    <div id="network-panel" class="tool-overlay">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>📡 NETWORK SCAN</h2>
        <div id="network-log">Initializing scan...</div>
    </div>

    <!-- DoS Attack Overlay -->
    <div id="dos-panel" class="tool-overlay">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>⚠️ DOS ATTACK SIMULATION</h2>
        <div id="dos-bar"><div id="dos-fill"></div></div>
        <p id="dos-status">Packets sent: 0</p>
    </div>

    <!-- Data Scrape Overlay -->
    <div id="scrape-panel" class="tool-overlay">
        <button class="close-btn" onclick="closeTools()">X</button>
        <h2>🕸️ DATA SCRAPING</h2>
        <div id="scrape-log">Connecting to API...</div>
    </div>

    <script>
        // --- Configuration ---
        const commands = {
            "miya spy karo": "openCamera",
            "scan network": "scanNetwork",
            "scrape data": "scrapeData",
            "start dos attack": "startDos",
            "stop": "closeTools"
        };

        let recognition;
        let mediaStream = null;
        let activeIntervals = [];

        // Clear all running intervals when closing tools
        function clearAllIntervals() {
            activeIntervals.forEach(clearInterval);
            activeIntervals = [];
        }

        // --- Voice Recognition Setup ---
        function startListening() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Voice recognition not supported on this browser. Use Chrome.");
                return;
            }
            
            try {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false; // Mobile par continuous stability ke liye false behtar hai
                recognition.interimResults = false;
                recognition.lang = 'en-IN'; 
                
                document.getElementById('status-text').innerText = "Listening... Speak now 🎙️";

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript.toLowerCase().trim();
                    document.getElementById('status-text').innerText = `Heard: "${transcript}"`;
                    
                    let executed = false;
                    for (let cmd in commands) {
                        if (transcript.includes(cmd)) {
                            executeTool(commands[cmd]);
                            executed = true;
                            break;
                        }
                    }
                    if (!executed) {
                        speak("Command not recognized");
                    }
                };

                recognition.onerror = function(event) {
                    document.getElementById('status-text').innerText = "Mic Error: " + event.error;
                };

                recognition.onend = function() {
                    // Automatically restart listening loop if needed, or leave idle
                    document.getElementById('status-text').innerText = "System Idle. Tap Mic.";
                };
                
                recognition.start();
            } catch (err) {
                document.getElementById('status-text').innerText = "Speech init failed: " + err.message;
            }
        }

        // --- Tool Execution Logic ---
        function executeTool(toolName) {
            closeTools(); // Clear any existing overlay/intervals
            
            switch(toolName) {
                case "openCamera":
                    startCamera();
                    speak("Spy Mode Activated");
                    break;
                case "scanNetwork":
                    openPanel('network-panel');
                    simulateScan();
                    speak("Scanning local network");
                    break;
                case "scrapeData":
                    openPanel('scrape-panel');
                    simulateScrape();
                    speak("Starting data scrape");
                    break;
                case "startDos":
                    openPanel('dos-panel');
                    simulateDos();
                    speak("Initiating DoS attack simulation");
                    break;
                case "closeTools":
                    closeTools();
                    break;
            }
        }

        function openPanel(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeTools() {
            clearAllIntervals();
            document.querySelectorAll('.tool-overlay').forEach(el => el.style.display = 'none');
            stopCamera();
            document.getElementById('status-text').innerText = "System Idle";
        }

        // --- Tool Implementations ---

        // 1. Camera Spy
        async function startCamera() {
            try {
                const video = document.getElementById('camera-feed');
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = mediaStream;
                openPanel('spy-panel');
            } catch (err) {
                document.getElementById('status-text').innerText = "Camera Access Denied or Not Supported.";
                alert("Camera permission required. Ensure app has camera permission.");
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            const video = document.getElementById('camera-feed');
            if (video) video.srcObject = null;
        }

        // 2. Network Scan Simulation
        function simulateScan() {
            const log = document.getElementById('network-log');
            log.innerHTML = "Initializing scan...";
            const devices = ["Router: 192.168.1.1", "Phone: 192.168.1.5", "Laptop: 192.168.1.12", "IoT Device: 192.168.1.20"];
            let i = 0;
            const interval = setInterval(() => {
                if (i >= devices.length) {
                    clearInterval(interval);
                    log.innerHTML += "<br><br><b>Scan Complete. All devices secure.</b>";
                    return;
                }
                log.innerHTML += `<br>> Found: ${devices[i]}`;
                log.scrollTop = log.scrollHeight;
                i++;
            }, 1000);
            activeIntervals.push(interval);
        }

        // 3. DoS Attack Simulation
        function simulateDos() {
            const fill = document.getElementById('dos-fill');
            const status = document.getElementById('dos-status');
            fill.style.width = '0%';
            let packets = 0;
            const interval = setInterval(() => {
                packets += Math.floor(Math.random() * 2500) + 500;
                let percent = Math.min((packets / 50000) * 100, 100);
                fill.style.width = percent + '%';
                status.innerText = `Packets sent: ${packets}`;
                if (packets >= 50000) {
                    clearInterval(interval);
                    status.innerText = "Simulation Completed Successfully";
                }
            }, 100);
            activeIntervals.push(interval);
        }

        // 4. Data Scrape Simulation
        function simulateScrape() {
            const log = document.getElementById('scrape-log');
            log.innerHTML = "Connecting to API endpoints...";
            const data = ["Target: local_database.db", "Fetching User Profiles...", "Email: user@example.com", "Session Token: xyz-9876-token", "Extraction Successful."];
            let i = 0;
            const interval = setInterval(() => {
                if (i >= data.length) {
                    clearInterval(interval);
                    log.innerHTML += "<br><br><b>Scraping Finished.</b>";
                    return;
                }
                log.innerHTML += `<br>> Extracted: ${data[i]}`;
                log.scrollTop = log.scrollHeight;
                i++;
            }, 800);
            activeIntervals.push(interval);
        }

        // Helper: Text to Speech
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Purana speech cancel karein
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
