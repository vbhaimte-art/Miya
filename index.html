<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>साथी</title>
<style>
:root{--bg:#f3efe6;--ink:#232a3b;--face:#8fcfbf;--soft:#dfe7e1;--accent:#e0b23a;--me:#232a3b;--me-t:#fff;--bot:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171c2a;--ink:#eef0f5;--face:#7cc3b2;--soft:#262d40;--accent:#e0b23a;--me:#e0b23a;--me-t:#171c2a;--bot:#262d40}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{display:flex;justify-content:center;padding:14px 0 6px}
#face{width:150px;height:150px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.talk #mouth{animation:talk .28s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
.listen #face-body{fill:var(--accent)}
#status{text-align:center;font-size:13px;opacity:.7;height:20px}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:16px;line-height:1.5;font-size:16px;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--me);color:var(--me-t);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--soft)}
#txt{flex:1;border:0;border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);min-width:0}
button{border:0;border-radius:50%;width:46px;height:46px;font-size:20px;background:var(--ink);color:var(--bg);cursor:pointer}
#mic.on{background:var(--accent);color:#232a3b}
button:focus-visible,#txt:focus-visible{outline:3px solid var(--accent)}
</style>
</head>
<body>
<div id="top">
<svg id="face" viewBox="0 0 150 150" aria-label="साथी का चेहरा">
<circle id="face-body" cx="75" cy="75" r="68" fill="var(--face)"/>
<ellipse class="eye" cx="52" cy="62" rx="8" ry="10" fill="#232a3b"/>
<ellipse class="eye" cx="98" cy="62" rx="8" ry="10" fill="#232a3b"/>
<ellipse id="mouth" cx="75" cy="102" rx="16" ry="9" fill="#232a3b"/>
</svg>
</div>
<div id="status"></div>
<div id="log"></div>
<div id="bar">
<button id="mic" title="बोलें" aria-label="बोलें">🎤</button>
<input id="txt" placeholder="यहाँ लिखें…" autocomplete="off">
<button id="send" title="भेजें" aria-label="भेजें">➤</button>
</div>

<script>
// ====== यहाँ अपनी सेटिंग बदलें ======
const WORKER_URL = "https://young-sky-01cdmy-assistant-api.vbhaimte.workers.dev";
const NAME = "साथी";
const PERSONA = `तुम "${NAME}" हो, मेरे निजी असिस्टेंट और दोस्त। मुझसे हिंदी में बात करो (मैं अंग्रेज़ी में लिखूँ तो अंग्रेज़ी में)।
जवाब छोटे रखो, 1-3 वाक्य, क्योंकि तुम बोलकर जवाब देते हो। इमोजी और markdown का इस्तेमाल मत करो।
अपनी सीधी और ईमानदार राय दो। मेरी हर बात से सहमत मत होना; ग़लत लगे तो सलीक़े से टोको और कारण बताओ।
ज़रूरत हो तो एक सवाल पूछो, उससे ज़्यादा नहीं।`;
// ====================================

const $ = id => document.getElementById(id);
const log = $("log"), txt = $("txt"), status = $("status"), mic = $("mic");
let history = [];
try { history = JSON.parse(localStorage.getItem("hist") || "[]"); } catch (e) {}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "me" : "bot");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
history.forEach(h => add(h.role, h.parts[0].text));
if (!history.length) add("model", "नमस्ते! मैं " + NAME + " हूँ। माइक दबाकर बोलिए या लिखिए।");

function save() {
  history = history.slice(-20);
  try { localStorage.setItem("hist", JSON.stringify(history)); } catch (e) {}
}

// ---- आवाज़ में जवाब ----
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "hi-IN";
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("hi"));
  if (v) u.voice = v;
  u.onstart = () => document.body.classList.add("talk");
  u.onend = u.onerror = () => document.body.classList.remove("talk");
  speechSynthesis.speak(u);
}

// ---- Gemini से बात ----
async function ask(text) {
  if (!text.trim()) return;
  add("user", text);
  history.push({ role: "user", parts: [{ text }] });
  status.textContent = "सोच रहा हूँ…";
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: PERSONA }] },
        contents: history.slice(-20)
      })
    });
    const data = await r.json();
    const reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") ||
      ("जवाब नहीं मिला। " + (data?.error?.message || ""));
    add("model", reply);
    history.push({ role: "model", parts: [{ text: reply }] });
    save();
    speak(reply);
  } catch (e) {
    add("model", "कनेक्शन में दिक्कत है। Worker का लिंक और इंटरनेट जाँचें।");
    history.pop();
  }
  status.textContent = "";
}

$("send").onclick = () => { const t = txt.value; txt.value = ""; ask(t); };
txt.addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });

// ---- बोलकर पूछना ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  mic.style.display = "none";
} else {
  const rec = new SR();
  rec.lang = "hi-IN";
  rec.interimResults = false;
  rec.onstart = () => { mic.classList.add("on"); document.body.classList.add("listen"); status.textContent = "सुन रहा हूँ…"; };
  rec.onend = () => { mic.classList.remove("on"); document.body.classList.remove("listen"); if (status.textContent === "सुन रहा हूँ…") status.textContent = ""; };
  rec.onerror = () => { status.textContent = "माइक की अनुमति दें या लिखकर पूछें।"; };
  rec.onresult = e => ask(e.results[0][0].transcript);
  mic.onclick = () => { speechSynthesis.cancel(); try { rec.start(); } catch (e) {} };
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
